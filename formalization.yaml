version: "v0.4"
project:
  name: "Determinant recognition for overlapping weighted cycles"
  description: >-
    For an invertible matrix of dimension n over a field, the determinant and
    the requirement of being a monic degree-n annihilator determine the
    characteristic polynomial exactly when the minimal polynomial has degree
    at least n−1. For two same-center cyclic block polynomials, the analogous
    condition is that the block lengths are coprime. An invertible weighted
    two-cycle plus three-cycle always meets the threshold, even when the
    block spectra overlap. A two-cycle plus six-cycle with matched normalized products yields an explicit
    degree-eight annihilator with the true determinant-derived constant term
    but with a different trace coefficient. The proofs concern the algebraic
    identification step, not an arithmetic application or the Riemann hypothesis.
  authors: ["Will Strinz"]
  license: "MIT"
  responsible_maintainers: ["Will Strinz"]

